version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: horizon_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  media:
    build:
      context: ./services/media
      dockerfile: Dockerfile
    container_name: horizon_media
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env.example
    environment:
      - MEDIA_PORT=5001
      - APP_ENV=development
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  workos:
    build:
      context: ./services/workos
      dockerfile: Dockerfile
    container_name: horizon_workos
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - WORKOS_PORT=8000
      - FRONTEND_URL=http://localhost:3000
      - DATABASE_URL=postgresql://postgres:password@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: horizon_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.example
    environment:
      - PORT=3000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://placeholder.supabase.co}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-placeholder-anon-key}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk}
      - MEDIA_URL=http://media:5001
      - WORKOS_URL=http://workos:8000
    depends_on:
      - media
      - workos

volumes:
  postgres_data:
