name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  contracts:
    name: Validate Contracts & Schema Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Generated Contracts are Fresh
        run: |
          python packages/contracts/scripts/generate_contracts.py --check

  services:
    name: Validate Python Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Media Service Dependencies
        run: |
          pip install --no-cache-dir -r services/media/requirements.txt
      - name: Test Media Service Health Endpoint
        run: |
          python -c "from services.media.app import app; client = app.test_client(); res = client.get('/health'); assert res.status_code == 200, res.status_code; assert res.get_json()['status'] == 'healthy'"
      - name: Run Media Service Tests
        run: |
          pytest services/media/tests -v
      - name: Install WorkOS Service Dependencies
        run: |
          pip install --no-cache-dir -r services/workos/requirements.txt
      - name: Test WorkOS Service Health Endpoint
        run: |
          python -c "from fastapi.testclient import TestClient; from services.workos.api.main import app; client = TestClient(app); res = client.get('/health'); assert res.status_code == 200, res.status_code; assert res.json()['status'] == 'healthy'"
      - name: Run WorkOS Service Tests
        run: |
          pytest services/workos/tests -v

  web:
    name: Validate Web App (Next.js 15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Dependencies
        working-directory: ./apps/web
        run: npm ci --workspaces=false
      - name: Type Check
        working-directory: ./apps/web
        run: npm run type-check --workspaces=false
      - name: Lint
        working-directory: ./apps/web
        run: npm run lint --workspaces=false
      - name: Build Next.js App
        working-directory: ./apps/web
        env:
          DEMO_MODE: "true"
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: npm run build --workspaces=false
